plugins {
    id 'org.jetbrains.intellij.platform' version '2.10.5'
}

apply plugin: 'java'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    targetCompatibility = javaVersion
    sourceCompatibility = javaVersion
}

sourceSets {
    main {
        java.srcDir 'src/main/java'
    }
    test {
        java.srcDir 'src/test/java'
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        create("IC", ideaVersion)
        plugins(['git4idea:201.8538.4'])
    }

    implementation ('com.google.inject:guice:5.1.0') {
        exclude group: 'com.google.guava', module: 'guava'
    }
    implementation ('com.google.inject.extensions:guice-multibindings:4.2.3') {
        exclude group: 'com.google.guava', module: 'guava'
    }
    implementation ('com.urswolfer.gerrit.client.rest:gerrit-rest-java-client:0.9.7') {
        exclude group: 'com.google.code.gson', module: 'gson'
        exclude group: 'com.google.guava', module: 'guava'
        exclude group: 'commons-logging', module: 'commons-logging'
        exclude group: 'org.apache.httpcomponents', module: 'httpclient'
    }
    implementation 'org.javassist:javassist:3.30.2-GA'

    testImplementation 'org.testng:testng:7.11.0'
    testImplementation 'org.easymock:easymock:5.6.0'
}

intellijPlatform {
    pluginConfiguration {
        name = 'gerrit-intellij-plugin'

        ideaVersion {
            sinceBuild = '203.4818.26'
        }
    }

    publishPlugin {
        channels = [ijPluginRepoChannel]
        token = provider {
            System.getenv('IJ_REPO_TOKEN')
        }
    }
}

test {
    useTestNG()
    exclude 'com/urswolfer/intellij/plugin/gerrit/rest/GerritUtilTest.*' // fails with java.lang.VerifyError at GerritUtilTest.java:34
}
